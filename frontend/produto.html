<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Produto</title>

    <link rel="stylesheet"
          href="css/produto-publico.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

<header>

    <button id="btnVoltar">

        <i class="fa-solid fa-arrow-left-long"></i>

    </button>

</header>

<main>

    <div class="produto-container">

        <div class="produto-imagem">

            <img
                id="imagemProduto"
                src=""
                alt="">

        </div>

        <div class="produto-info">

            <h1 id="nomeProduto"></h1>

            <span id="precoProduto"></span>

            <div class="categoriaTag">

                <span id="categoriaProduto"></span>

            </div>

            <p>

                <strong>Prazo de entrega:</strong>

                <span id="prazoEntrega"></span>

            </p>

            <p id="descricaoProduto"></p>

            <a

                id="btnWhatsapp"

                target="_blank">

                Comprar pelo WhatsApp

            </a>

        </div>

    </div>

</main>

<footer>

    <div class="container footer-container">

        <div class="footer-info">

            <h2 id="footerNomeLoja"></h2>

            <p id="footerEndereco"></p>

            <p>
                <strong>Funcionamento:</strong>
                <span id="footerHorario"></span>
            </p>

            <p>
                <strong>Telefone:</strong>
                <span id="footerTelefone"></span>
            </p>

            <p>
                <strong>WhatsApp:</strong>
                <span id="footerWhatsApp"></span>
            </p>

            <p>
                <strong>E-mail:</strong>
                <span id="footerEmail"></span>
            </p>

        </div>

        <div class="footer-redes">

            <h3>Redes Sociais</h3>

            <a
                id="footerFacebook"
                target="_blank">

                Facebook

            </a>

            <a
                id="footerInstagram"
                target="_blank">

                Instagram

            </a>

        </div>

    </div>

    <div class="footer-copy">

        © <span id="anoAtual"></span>
        <span id="footerCopyNome"></span>.
        Todos os direitos reservados.

    </div>

</footer>

<script type="module"
        src="js/produto-publico.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar Categoria</title>

    <link rel="stylesheet" href="/frontend/css/categoria-editar.css">

</head>

<body>

<header>

    <button id="btnVoltar">
        ← Voltar
    </button>

    <h1>Editar Categoria</h1>

</header>

<main>

<form id="formCategoria">

    <label for="nomeCategoria">

        Nome da Categoria

    </label>

    <input
        type="text"
        id="nomeCategoria">

    <div class="acoes">

        <button
            type="submit"
            id="btnSalvar">

            Salvar Alterações

        </button>

        <button
            type="button"
            id="btnExcluir">

            Excluir Categoria

        </button>

    </div>

</form>

</main>

<script type="module" src="/frontend/js/categoria-editar.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo</title>

    <link rel="stylesheet"
          href="../css/dashboard.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

<header>

    <div class="header-container">

        <h1></h1>

        <div class="usuario">

            <span id="nomeUsuario"></span>

            <button id="btnLogout">
                Sair
            </button>

        </div>

    </div>

</header>

<main>

    <section class="heroDashboard">

        <h2>Painel Administrativo</h2>

        <p>
            Gerencie produtos, categorias e configurações da sua confeitaria.
        </p>

    </section>

    <section class="cardsDashboard">

        <a
            href="produtos.html"
            class="cardDashboard">

            <h3>Produtos</h3>

            <p>
                Cadastre, edite e organize os produtos da loja.
            </p>

        </a>

        <a
            href="categorias.html"
            class="cardDashboard">


            <h3>Categorias</h3>

            <p>
                Organize os produtos em categorias.
            </p>

        </a>

        <a
            href="configuracoes.html"
            class="cardDashboard">

            <h3>Configurações</h3>

            <p>
                Personalize informações, imagens e redes sociais.
            </p>

        </a>

    </section>

</main>

<script type="module"
        src="../js/dashboard.js"></script>

</body>

</html>

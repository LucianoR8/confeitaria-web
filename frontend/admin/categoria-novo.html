<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nova Categoria</title>

    <link rel="stylesheet" href="../css/categoria-editar.css">

</head>

<body>

<header>

    <button id="btnVoltar">
        ← Voltar
    </button>

    <h1>Nova Categoria</h1>

</header>

<main>

<form id="formCategoria">

    <label for="nomeCategoria">
        Nome da Categoria
    </label>

    <input
        type="text"
        id="nomeCategoria"
        maxlength="100"
        required>

    <div class="acoes">

        <button
            type="submit"
            id="btnSalvar">

            Cadastrar

        </button>

    </div>

</form>

</main>

<script type="module" src="../js/categoria-novo.js"></script>

</body>

</html>

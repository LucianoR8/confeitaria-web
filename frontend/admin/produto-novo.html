<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novo Produto</title>

    <link rel="stylesheet" href="../css/produto-editar.css">

</head>

<body>

   <header>

    <button id="btnVoltar">
        ← Voltar
    </button>

    <h1 class="title">Novo Produto</h1>

</header>

<main>

<form id="formProduto">

    <div class="produto-topo">

        <div class="produto-imagem-area">

        <h2>Imagem</h2>

        <img
            id="imagemAtual"
            src=""
            alt="Imagem do produto">

        <input
            type="file"
            id="imagem"
            accept=".jpg,.jpeg,.png,.webp">

    </div>

    <div class="produto-dados">


        <label for="nomeProduto">

            Nome

        </label>

        <input
            type="text"
            id="nomeProduto">


        <label for="preco">

            Preço

        </label>

        <input
            type="number"
            id="preco"
            step="0.01">


        <label for="categoriaId">

            Categoria

        </label>

        <select id="categoriaId">

        </select>



        <label for="prazoEntrega">

            Prazo de entrega

        </label>

        <select id="prazoEntrega">

    <option value="30 minutos">
        30 minutos
    </option>

    <option value="1 hora">
        1 hora
    </option>

    <option value="2 horas">
        2 horas
    </option>

    <option value="24 horas">
        24 horas
    </option>

    <option value="2 dias">
        2 dias
    </option>

    <option value="3 dias">
        3 dias
    </option>

    <option value="5 dias úteis">
        5 dias úteis
    </option>

</select>

</div>
<section>
<label for="descricaoProduto">

            Descrição

        </label>

        <textarea
            id="descricaoProduto"
            rows="5">

        </textarea>

</section>
    

    </div>
    <div  class="produto-opcoes">
    <section>

        <label class="checkbox-item">

            <input
                type="checkbox"
                id="ativo">

            Produto ativo

        </label>

    </section>

    <section>

        <label class="checkbox-item">

            <input
                type="checkbox"
                id="destaque">

            Produto destaque

        </label>

    </section>
</div>
    <div class="acoes">
    <button
        type="submit"
        id="btnSalvar">

        Cadastrar Produto

    </button>

    </div>

</form>

</main>

    <script type="module" src="../js/produto-novo.js"></script>

</body>

</html>

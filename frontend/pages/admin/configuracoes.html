<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Configurações</title>

    <link rel="stylesheet"
          href="/frontend/css/configuracoes.css">

</head>

<body>

<header>

    <button id="btnVoltar">
        ← Voltar
    </button>

    <h1>Configurações</h1>

</header>

<main>

<form id="formConfiguracao">

    <!-- IMAGENS -->

    <section class="card">

        <h2>Imagens da Loja</h2>

        <div class="config-imagens">

            <div class="imagem-card">

                <h3>Logo</h3>

                <img
                    id="logoAtual"
                    src=""
                    alt="Logo">

                <button type="button" id="btnLogo">Alterar Logo</button>

                <input
                    type="file"
                    id="logo"
                    accept=".png,.jpg,.jpeg,.webp">

            </div>

            <div class="imagem-card">

                <h3>Ícone (Favicon)</h3>

                <img
                    id="iconeAtual"
                    src=""
                    alt="Ícone">

                <button type="button" id="btnIcone">Alterar Ícone</button>

                <input
                    type="file"
                    id="icone"
                    accept=".png,.jpg,.jpeg,.webp">

            </div>

        </div>

        <div class="banner-area">

            <h3>Banner</h3>

            <img
                id="bannerAtual"
                src=""
                alt="Banner">

            <button type="button" id="btnBanner">Alterar Banner</button>

            <input
                type="file"
                id="banner"
                accept=".png,.jpg,.jpeg,.webp">

        </div>

    </section>

    <!-- DADOS -->

    <section class="card">

        <h2>Informações da Loja</h2>

        <div class="dados">

            <div>

                <label>Nome da Loja</label>
                <input type="text" id="nomeLoja">

            </div>

            <div>

                <label>Telefone</label>
                <input type="text" id="telefone">

            </div>

            <div>

                <label>WhatsApp</label>
                <input type="text" id="whatsApp">

            </div>

            <div>

                <label>Email</label>
                <input type="email" id="email">

            </div>

            <div>

                <label>Facebook</label>
                <input type="text" id="facebook">

            </div>

            <div>

                <label>Instagram</label>
                <input type="text" id="instagram">

            </div>

            <div class="campo-inteiro">

                <label>Endereço</label>
                <input type="text" id="endereco">

            </div>

        </div>

    </section>

    <!-- CONFIGURAÇÕES -->

    <section class="card">

        <h2>Configurações da Loja</h2>

        <div class="config-grid">

            <div>

                <label>Abre às</label>
                <input type="time" id="abreAs">

            </div>

            <div>

                <label>Fecha às</label>
                <input type="time" id="fechaAs">

            </div>

            <div class="campo-inteiro">

                <label>Quantidade máxima de destaques</label>

                <input
                    type="number"
                    id="quantidadeMaximaDestaques">

            </div>

        </div>

    </section>

    <div class="acoes">

        <button
            type="submit"
            id="btnSalvar">

            Salvar Alterações

        </button>

    </div>

</form>

</main>

<script
    type="module"
    src="/frontend/js/configuracoes.js">
</script>

</body>

</html>

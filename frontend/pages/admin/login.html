<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Login Administrativo</title>

    <link rel="stylesheet" href="/frontend/css/login.css">

</head>

<body>

    <main>

        <form id="formLogin">

            <h1>Área Administrativa</h1>

            <input
                type="email"
                id="email"
                placeholder="E-mail">

            <input
                type="password"
                id="senha"
                placeholder="Senha">

            <button type="submit">

                Entrar

            </button>

            <p id="mensagemErro"></p>

        </form>

    </main>

    <script type="module" src="/frontend/js/login.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Produto</title>

    <link rel="stylesheet"
          href="/frontend/css/produto-publico.css">

</head>

<body>

<header>

    <button id="btnVoltar">

        ← Voltar

    </button>

</header>

<main>

    <div class="produto-container">

        <div class="produto-imagem">

            <img
                id="imagemProduto"
                src=""
                alt="">

        </div>

        <div class="produto-info">

            <h1 id="nomeProduto"></h1>

            <span id="precoProduto"></span>

            <div class="categoriaTag">

                <span id="categoriaProduto"></span>

            </div>

            <p>

                <strong>Prazo de entrega:</strong>

                <span id="prazoEntrega"></span>

            </p>

            <p id="descricaoProduto"></p>

            <a

                id="btnWhatsapp"

                target="_blank">

                Comprar pelo WhatsApp

            </a>

        </div>

    </div>

</main>

<script type="module"
        src="/frontend/js/produto-publico.js"></script>

</body>

</html>

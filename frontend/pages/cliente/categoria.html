<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Categoria</title>

    <link rel="stylesheet" href="/frontend/css/categoria-publica.css">

</head>

<body>

<header>

    <button id="btnVoltar">
        ← Voltar
    </button>

    <h1 id="tituloCategoria"></h1>

</header>

<main>

    <section id="listaProdutos">

    </section>

</main>

<footer>

    <div class="container footer-container">

        <div class="footer-info">

            <h2 id="footerNomeLoja"></h2>

            <p id="footerEndereco"></p>

            <p>
                <strong>Funcionamento:</strong>
                <span id="footerHorario"></span>
            </p>

            <p>
                <strong>Telefone:</strong>
                <span id="footerTelefone"></span>
            </p>

            <p>
                <strong>WhatsApp:</strong>
                <span id="footerWhatsApp"></span>
            </p>

            <p>
                <strong>E-mail:</strong>
                <span id="footerEmail"></span>
            </p>

        </div>

        <div class="footer-redes">

            <h3>Redes Sociais</h3>

            <a
                id="footerFacebook"
                target="_blank">

                Facebook

            </a>

            <a
                id="footerInstagram"
                target="_blank">

                Instagram

            </a>

        </div>

    </div>

    <div class="footer-copy">

        © <span id="anoAtual"></span>
        <span id="footerCopyNome"></span>.
        Todos os direitos reservados.

    </div>

</footer>

<script type="module" src="/frontend/js/categoria-publica.js"></script>

</body>

</html>
